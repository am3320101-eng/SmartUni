# ===================================================================
# 1. Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smartuni}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:123456}
# ===================================================================
# 2. JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 3. Security & JWT Configuration
# ===================================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===================================================================
# 4. CampusMind Features (QR Code & Attendance)
# ===================================================================
qr.secret=${QR_SECRET:SmartUniQRSecretKey2024!@#$%^&*()}
qr.validity-minutes=5

# ===================================================================
# 5. AI Integration (Search Engine Service)
# ===================================================================
ai.service.url=https://dummy-ai-link-temporary.com

# ===================================================================
# 6. Server & API Documentation Configuration
# ===================================================================
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html